<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Portfolio Income - SISPAA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* LOGIN PAGE */
        #loginPage {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #4a148c, #6a1b9a);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-box .icon { font-size: 48px; margin-bottom: 10px; }
        .login-box h1 { color: #4a148c; font-size: 24px; }
        .login-box p { color: #6d6d8a; font-size: 14px; margin-bottom: 25px; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        .login-box input:focus { border-color: #4a148c; }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #4a148c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { background: #2e0d5c; }
        .login-box .error {
            color: #c62828;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .login-box .error.show { display: block; }
        .login-box .hint {
            color: #999;
            font-size: 12px;
            margin-top: 15px;
        }
        .login-box .hint span {
            background: #f0f2f5;
            padding: 2px 10px;
            border-radius: 6px;
            font-family: monospace;
            color: #4a148c;
        }

        /* MAIN CONTENT */
        #mainContent {
            display: none;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #4a148c, #6a1b9a);
            color: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; }
        .header p { opacity: 0.85; font-size: 14px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #4a148c;
        }
        .stat-card .num { font-size: 22px; font-weight: 700; color: #4a148c; }
        .stat-card .label { font-size: 11px; color: #5a5a7a; }
        .stat-card.saham { border-left-color: #1565c0; }
        .stat-card.saham .num { color: #1565c0; }
        .stat-card.asb { border-left-color: #2e7d32; }
        .stat-card.asb .num { color: #2e7d32; }
        .stat-card.th { border-left-color: #e65100; }
        .stat-card.th .num { color: #e65100; }
        
        .income-list { display: flex; flex-direction: column; gap: 12px; }
        .income-item {
            background: white;
            border-radius: 12px;
            padding: 16px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid #4a148c;
        }
        .income-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .income-source { font-weight: 700; color: #4a148c; font-size: 15px; }
        .income-type {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 20px;
            background: #f3e5f5;
            color: #6a1b9a;
        }
        .income-amount {
            font-size: 18px;
            font-weight: 700;
            color: #2e7d32;
        }
        .income-meta {
            font-size: 13px;
            color: #6d6d8a;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }
        
        .footer {
            text-align: center;
            font-size: 12px;
            color: #8888aa;
            margin-top: 24px;
            padding: 12px;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            background: #6c757d;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .refresh-btn {
            display: inline-block;
            margin: 8px;
            background: #4a148c;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
    <div class="login-box">
        <div class="icon">💰</div>
        <h1>Portfolio Income</h1>
        <p>🔒 Hanya untuk pemilik rekod</p>
        <input type="password" id="passwordInput" placeholder="Masukkan kata laluan..." autofocus>
        <button onclick="checkPassword()">🔓 Masuk</button>
        <div class="error" id="errorMessage">❌ Kata laluan salah. Cuba lagi.</div>
        <div class="hint">🔑 <span>admin789</span></div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent">
    <div class="container">
        <div class="header">
            <h1>💰 Portfolio Income</h1>
            <p>Rekod pendapatan portfolio · <span id="dateDisplay"></span></p>
            <p style="font-size:12px; opacity:0.7; margin-top:4px;">
                Total Bulanan: RM <span id="totalIncome">0.00</span>
                <a href="javascript:location.reload()" class="refresh-btn" style="margin-left:12px;">🔄 Refresh</a>
            </p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card saham">
                <div class="num" id="statSaham">0</div>
                <div class="label">💰 Saham</div>
            </div>
            <div class="stat-card asb">
                <div class="num" id="statASB">0</div>
                <div class="label">🏦 ASB</div>
            </div>
            <div class="stat-card th">
                <div class="num" id="statTH">0</div>
                <div class="label">🕌 Tabung Haji</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statLain">0</div>
                <div class="label">📊 Lain-lain</div>
            </div>
        </div>
        
        <div class="search-bar" style="background:white;border-radius:12px;padding:12px 16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <input type="text" placeholder="🔍 Cari pendapatan..." id="searchInput" style="width:100%;border:none;outline:none;font-size:14px;">
        </div>
        
        <div class="income-list" id="incomeList">
            <!-- Data akan dimuat di sini -->
        </div>
        
        <div style="text-align:center; margin-top:16px;">
            <a href="mystory.html" class="back-link">← Kembali ke MyStory</a>
        </div>
        <div class="footer">Portfolio Income · © 2026</div>
    </div>
</div>

<script>
// LOGIN
const CORRECT_PASSWORD = '434343';

function checkPassword() {
    const password = document.getElementById('passwordInput').value;
    const error = document.getElementById('errorMessage');
    
    if (password === CORRECT_PASSWORD) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        loadIncome();
    } else {
        error.classList.add('show');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
}

document.getElementById('passwordInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { checkPassword(); }
});

// DATA
function loadIncome() {
    const incomes = [
        { date: '2026-09-16', source: 'Saham Maybank', type: 'Dividen', amount: 150.00, notes: '1000 unit × RM0.15' },
        { date: '2026-09-20', source: 'ASB', type: 'Dividen', amount: 200.00, notes: 'Tahunan' },
        { date: '2026-09-25', source: 'Tabung Haji', type: 'Hibah', amount: 100.00, notes: 'Tahunan' },
        { date: '2026-09-28', source: 'Simpanan Tetap', type: 'Faedah', amount: 80.00, notes: '3.5% setahun' }
    ];
    
    let totalSaham = 0, totalASB = 0, totalTH = 0, totalLain = 0, total = 0;
    
    incomes.forEach(i => {
        if (i.source.includes('Saham')) totalSaham += i.amount;
        else if (i.source.includes('ASB')) totalASB += i.amount;
        else if (i.source.includes('Tabung Haji')) totalTH += i.amount;
        else totalLain += i.amount;
        total += i.amount;
    });
    
    document.getElementById('statSaham').textContent = totalSaham.toFixed(0);
    document.getElementById('statASB').textContent = totalASB.toFixed(0);
    document.getElementById('statTH').textContent = totalTH.toFixed(0);
    document.getElementById('statLain').textContent = totalLain.toFixed(0);
    document.getElementById('totalIncome').textContent = total.toFixed(2);
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('ms-MY');
    
    const list = document.getElementById('incomeList');
    let html = '';
    
    incomes.forEach(i => {
        html += `
        <div class="income-item">
            <div class="income-header">
                <span class="income-source">${i.source}</span>
                <span class="income-type">${i.type}</span>
            </div>
            <div class="income-amount">RM ${i.amount.toFixed(2)}</div>
            <div class="income-meta">
                <span>📅 ${i.date}</span>
                <span>📝 ${i.notes}</span>
            </div>
        </div>
        `;
    });
    
    list.innerHTML = html;
    
    document.getElementById('searchInput').addEventListener('input', function() {
        const keyword = this.value.toLowerCase().trim();
        document.querySelectorAll('.income-item').forEach(item => {
            item.style.display = item.textContent.toLowerCase().includes(keyword) ? 'block' : 'none';
        });
    });
}
</script>
</body>
</html>
